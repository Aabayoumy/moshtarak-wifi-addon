---
name: TONLY MTTL-W01 WiFi
version: "1.0.3"
slug: tonly_mttl_w01
description: >-
  Controls TONLY / LG-U+ MTTL-W01 four-socket Wi-Fi power strips over the
  strip's undocumented callback protocol.
url: https://github.com/Aabayoumy/tonly-mttl-w01-addon
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
# MUST be false, and this is not cosmetic.
#
# The Home Assistant base image sets ENTRYPOINT ["/init"], which is s6-overlay
# v3. s6-overlay only works when it genuinely is PID 1: it installs signal
# handlers, reaps zombies and hands off to the container CMD through
# `s6-overlay-suexec`, which refuses to run as anything other than PID 1.
#
# This Supervisor passes `init` straight through to Docker's `--init` flag, and
# it DEFAULTS TO TRUE. With --init, Docker injects tini as PID 1, so /init runs
# as a child of tini, and the app died on every start with:
#
#     s6-overlay-suexec: fatal: can only run as pid 1
#
# Setting init: false stops Docker injecting anything, /init becomes PID 1, and
# the CMD runs under s6 supervision as intended. Every core add-on that ships a
# main daemon (mosquitto, and the rest) sets this too.
#
# Note that removing USER from the Dockerfile fixed a related symptom of the
# same misunderstanding, but the app still would not start until this was set.
init: false
homeassistant_api: false
hassio_api: false
host_network: false
ingress: false
stdin: false
map:
  - config:rw
# The strip DIALS OUT to TCP 10086 and holds the socket open; it never accepts
# an inbound connection. This is therefore the one port that must be reachable
# from the LAN, and it is only opened for that reason.
#
# The controller's HTTP API (8099) is deliberately NOT published. It has no
# authentication of any kind, so exposing it would let any device on the LAN
# drive the strip. Home Assistant reaches it over the add-on's internal
# network instead, where nothing else lives.
ports:
  10086/tcp: 10086
# /api/health answers 200 even with zero strips connected, so this cannot
# restart-loop a fresh install that has no hardware yet.
watchdog: http://[HOST]:8099/api/health
panel_icon: mdi:power-socket-us
options:
  mode: auto
  # Seconds between state reads. This is the freshness window of the state
  # cache. Deliberately short: after a switch command the controller
  # force-reads before the strip's echo lands, so the cache can briefly hold
  # the previous state; a 2s window means HA sees the true echo on the very
  # next read instead of up to 10s later.
  poll: 2
  protect: ""
  protect_by_device: ""
  history_interval: 20
  history_keep_h: 48
schema:
  mode: list(auto|mttl|tcp|sim)?
  poll: int(1,3600)?
  protect: str?
  protect_by_device: str?
  history_interval: int(5,3600)?
  history_keep_h: float(0.1,8760)?
# No `image:` key on purpose. Setting it would make the Supervisor try to PULL a
# published image instead of building the Dockerfile next to this file. Once
# images are actually built and pushed to ghcr.io, adding it becomes a valid
# optimisation - until then it is a guaranteed install failure.